name: Deploy to GitHub Pages

# Publishing through a workflow rather than "Deploy from a branch" keeps the
# deploy in version control and, unlike branch mode, records a run that can be
# inspected when the site does not come up.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Points the repository at workflow-based publishing, so the site
          # deploys whichever source was selected in Settings beforehand.
          enablement: true

      - name: Stage the site
        # Only the files the browser actually requests are published; the build
        # script and the README stay in the repository but off the web root.
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets _site/
          echo "Published files:"
          find _site -type f | sort

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
